dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  injectable_generator: ^3.0.2
  isar_community_generator: ^3.3.2
  freezed: ^3.1.0
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4
  msix: ^3.17.0

dependency_overrides:
  connectivity_plus: 7.0.0
  # irondash_engine_context:
  #   git:
  #     url: https://github.com/Sabbar-Engineering/irondash
  #     path: "engine_context/dart"

flutter:
  config:
    enable-swift-package-manager: false
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/icons/
    - fonts/

  fonts:
    - family: RobotoFlex
      fonts:
        - asset: fonts/RobotoFlex-VariableFont.ttf
    - family: JetBrainsMono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
    - family: DockIcons
      fonts:
        - asset: fonts/DockIcons.ttf
    - family: CustomIcons
      fonts:
        - asset: fonts/CustomIcons.ttf

msix_config:
  display_name: CopyCat Clipboard Manager
  publisher_display_name: Entility Studio
  publisher: CN=9130C7DE-B3E2-451F-88B6-0D0071113AA4
  identity_name: EntilityStudio.CopyCatClipboard
  # msix_version: 1.0.0.0 - will be taken from the version in pubspec.yaml
  logo_path: ./assets/images/icons/icon.png
  # we are using microsoft store signing, so no need to install a certificate
  install_certificate: false
  store: true
  windows_build_args: --obfuscate --split-debug-info=./build_symbols --dart-define-from-file="local/prod.json"
  capabilities: internetClient, privateNetworkClientServer
  languages: en-US #, fr-FR, es-ES, de-DE, pt-BR, zh-CN
  protocol_activation: clipboard
  execution_alias: copycat

flutter_launcher_icons:
  image_path: "logo_resources/icon_2026_flat.png"
  android: true
  adaptive_icon_background: "#262141"
  adaptive_icon_foreground: "logo_resources/icon_2026_adaptive_fg.png"
  adaptive_icon_monochrome: "logo_resources/icon_2026_monochrome_fg.png"
  min_sdk_android: 24

  ios: true
  image_path_ios: "logo_resources/icon_2026_no_pad.png"
  remove_alpha_ios: true

  windows:
    generate: true
    icon_size: 256
    image_path: "logo_resources/icon_2026_flat.png"

  macos:
    generate: true
    image_path: "logo_resources/icon_2026_macos.png"
